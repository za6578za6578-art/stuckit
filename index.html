<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stuckit</title>
<meta name="description" content="Stuckit measures how far back you take the club on every wedge shot, from your Apple Watch, as a percentage of your full backswing.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="preload" as="image" href="assets/screen-reading.jpg">
<script>
  (function () {
    var root = document.documentElement;
    try {
      var saved = localStorage.getItem('stuckit-theme');
      if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
    } catch (e) {}
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var seen = false;
    try { seen = sessionStorage.getItem('stuckit-intro') === '1'; } catch (e) {}
    root.classList.add('pre');
    if (!seen) root.classList.add('intro');
    function bail() {
      window.__shown = true;
      root.classList.remove('pre', 'intro');
      var layer = document.getElementById('intro');
      if (layer) layer.remove();
    }
    setTimeout(function () { if (!window.__introRunning) bail(); }, 2500);
    setTimeout(function () { if (!window.__introDone) bail(); }, 6000);
  })();
</script>
<style>

:root {
  --ground: #ffffff;
  --ink: #000000;
  --ink-2: rgba(0, 0, 0, .72);
  --hair: rgba(0, 0, 0, .14);
  --face: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --gutter: 20px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #000000; --ink: #ffffff; --ink-2: rgba(255, 255, 255, .74); --hair: rgba(255, 255, 255, .14);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #000000; --ink: #ffffff; --ink-2: rgba(255, 255, 255, .74); --hair: rgba(255, 255, 255, .14);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; padding-inline: var(--gutter);
  background: var(--ground); color: var(--ink);
  font-family: var(--face); -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; }
img { max-width: 100%; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 6px; }

.intro-layer { display: none; }
.intro .intro-layer { display: grid; place-items: center; position: fixed; inset: 0; z-index: 30; cursor: pointer; }
.intro-bg { position: absolute; inset: 0; background: var(--ground); }
.intro-logo { position: relative; width: min(72vw, 460px); height: auto; color: var(--ink); overflow: visible; transform-origin: 0 0; }
.intro .bar .lockup { visibility: hidden; }

.bar {
  position: fixed; inset: 0 0 auto 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  height: calc(64px + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) clamp(16px, 3vw, 40px) 0;
  background: var(--ground); border-bottom: 1px solid var(--hair);
}
.brand { display: flex; align-items: center; min-height: 44px; color: var(--ink); }

.lockup { height: 40px; width: auto; display: block; overflow: visible; }
.actions { display: flex; align-items: center; gap: 4px; }
.icon {
  display: grid; place-items: center; width: 44px; height: 44px;
  padding: 0; border: 0; background: none; color: var(--ink); cursor: pointer; border-radius: 12px;
}
.icon svg { width: 21px; height: 21px; display: block; }

.store {
  display: inline-flex; flex-direction: column; justify-content: center;
  height: 38px; padding: 0 14px; margin-right: 6px;
  background: #000; color: #fff; border: 1px solid #a6a6a6; border-radius: 9px;
  line-height: 1; white-space: nowrap; cursor: default;
}
.store small { font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
.store span { font-size: 15px; margin-top: 3px; }

main { padding-top: calc(64px + env(safe-area-inset-top)); }
.hero {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
  gap: clamp(40px, 6vw, 96px);
  max-width: 1200px; margin: 0 auto;
  min-height: calc(100svh - 64px - 57px);
  padding-block: clamp(36px, 7vh, 80px);
}
.words { display: grid; gap: clamp(16px, 2vw, 26px); }
h1 {
  margin: 0; max-width: 13em;
  font-size: clamp(31px, 2.6vw + 14px, 54px); line-height: 1.12; font-weight: 300;
  letter-spacing: -.02em; text-wrap: balance;
}
.sub { margin: 0; max-width: 30em; font-size: clamp(18px, .6vw + 14px, 22px); line-height: 1.5; color: var(--ink-2); }

.devices { display: flex; align-items: flex-end; justify-content: center; gap: clamp(20px, 3.5vw, 56px); }
.dev { position: relative; flex: none; }
.dev .bezel { position: relative; display: block; width: 100%; height: auto; }
.dev .screen { position: absolute; object-fit: cover; }
.phone { width: clamp(176px, 19vw, 280px); }
.phone .screen { left: 5.333%; top: 2.5%; width: 89.333%; height: 95%; border-radius: 14% / 6.4%; }

.watch { width: clamp(132px, 11vw, 160px); }
.watch .screen { left: 12.857%; top: 21.818%; width: 74.286%; height: 56.364%; border-radius: 24% / 20%; }

.pre .reveal, .pre .screen { opacity: 0; }

@media (max-width: 820px) {
  .hero { grid-template-columns: minmax(0, 1fr); min-height: 0; gap: 40px; padding-block: 40px 20px; }
}
@media (max-width: 520px) {
  .store { padding: 0 10px; margin-right: 2px; height: 36px; }
  .store span { font-size: 13.5px; }
  .lockup { height: 34px; }
  .devices { gap: 20px; }
}

footer {
  display: flex; justify-content: space-between; align-items: center; gap: 16px;
  max-width: 1200px; margin: 0 auto;
  padding-block: 6px calc(6px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--hair);
  font-size: 14px; color: var(--ink-2);
}
footer nav { display: flex; gap: 22px; }
footer a { display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; }
footer a:hover { color: var(--ink); }

.menu {
  position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) clamp(16px, 3vw, 40px) 0;
  background: var(--ground);
  opacity: 0; visibility: hidden; transition: opacity .2s ease, visibility 0s .2s;
}
.menu-open .menu { opacity: 1; visibility: visible; transition: opacity .2s ease; }
.menu .top { display: flex; justify-content: space-between; align-items: center; height: 64px; }
.menu nav { display: flex; flex-direction: column; gap: 6px; padding-top: 40px; }
.menu nav a, .menu nav p {
  margin: 0; font-size: 34px; font-weight: 300; letter-spacing: -.015em; text-decoration: none;
  min-height: 52px; display: flex; align-items: baseline; gap: 14px;
}
.menu nav p small { font-size: 14px; font-weight: 400; letter-spacing: 0; color: var(--ink-2); }
@media (prefers-reduced-motion: reduce) { .menu { transition: none; } }
</style>
</head>

<script type="module">
  import { animate } from "./assets/motion-mini-11.13.5.js";
  const root = document.documentElement;
  const ease = [0.2, 0.7, 0.2, 1];

  const done = (c) => (c && c.finished ? c.finished : Promise.resolve(c));

  function reveal() {
    const els = [...document.querySelectorAll('.reveal, .screen')];
    els.forEach((el) => {
      el.style.opacity = '0';
      if (el.classList.contains('reveal')) el.style.transform = 'translateY(18px)';
    });
    root.classList.remove('pre');
    els.forEach((el) => {
      const lift = el.classList.contains('reveal');
      const clear = () => { el.style.opacity = ''; el.style.transform = ''; };
      try {
        done(animate(el,
          lift ? { opacity: [0, 1], transform: ['translateY(18px)', 'translateY(0px)'] } : { opacity: [0, 1] },
          { duration: lift ? 0.9 : 1.1, delay: Number(el.dataset.delay || 0), ease }
        )).then(clear, clear);
      } catch (e) { clear(); }
    });
  }

  async function intro(layer) {
    window.__introRunning = true;
    const q = (s) => layer.querySelector(s);
    const green = q('.i-green'), flag = q('.i-flag'), ball = q('.i-ball');
    const letters = [...layer.querySelectorAll('.i-ltr')];
    const lg = document.getElementById('green').getTotalLength() || 2600;
    const lf = document.getElementById('flag').getTotalLength() || 1200;
    green.style.strokeDasharray = lg; green.style.strokeDashoffset = lg;
    flag.style.strokeDasharray = lf; flag.style.strokeDashoffset = lf;
    ball.style.opacity = '0';
    letters.forEach((l) => { l.style.opacity = '0'; });

    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      window.__introDone = true;
      layer.remove();
      root.classList.remove('intro');
      try { sessionStorage.setItem('stuckit-intro', '1'); } catch (e) {}
      try { reveal(); } finally { root.classList.remove('pre'); }
    };
    layer.addEventListener('click', finish);
    window.addEventListener('keydown', finish, { once: true });

    const drawing = [
      animate(green, { strokeDashoffset: [lg, 0] }, { duration: 0.7, ease }),
      animate(flag, { strokeDashoffset: [lf, 0] }, { duration: 0.5, delay: 0.5, ease }),
      animate(ball, {
        opacity: [0, 1, 1, 1, 1],
        transform: ['translate(-150px, -170px)', 'translate(-40px, 0px)', 'translate(-18px, -26px)', 'translate(-4px, 0px)', 'translate(0px, 0px)'],
      }, { duration: 0.6, delay: 0.8 }),
      ...letters.map((l, i) => animate(l,
        { opacity: [0, 1], transform: ['translateY(30px)', 'translateY(0px)'] },
        { duration: 0.35, delay: 0.95 + i * 0.05, ease })),
    ];
    await Promise.all(drawing.map(done));
    if (finished) return;

    const logo = q('.intro-logo');
    const from = logo.getBoundingClientRect();
    const to = document.getElementById('brand-logo').getBoundingClientRect();
    const scale = to.width / from.width;
    await Promise.all([
      done(animate(logo,
        { transform: ['translate(0px, 0px) scale(1)', `translate(${to.left - from.left}px, ${to.top - from.top}px) scale(${scale})`] },
        { duration: 0.75, delay: 0.25, ease: [0.65, 0, 0.25, 1] })),
      done(animate(q('.intro-bg'), { opacity: [1, 0] }, { duration: 0.5, delay: 0.6 })),
    ]);
    finish();
  }

  const layer = document.getElementById('intro');
  if (!window.__shown && root.classList.contains('pre')) {
    if (layer && root.classList.contains('intro')) {
      intro(layer).catch(() => {
        window.__introDone = true;
        layer.remove();
        root.classList.remove('intro', 'pre');
      });
    }
    else reveal();
  }
</script>

<script>
(function () {
  var root = document.documentElement;

  var dark = matchMedia('(prefers-color-scheme: dark)');
  var toggle = document.getElementById('theme');
  function current() { return root.getAttribute('data-theme') || (dark.matches ? 'dark' : 'light'); }
  function sync() {
    var chosen = root.getAttribute('data-theme');
    document.querySelectorAll('source[data-dark]').forEach(function (s) {
      s.media = chosen ? (chosen === 'dark' ? 'all' : 'not all') : '(prefers-color-scheme: dark)';
    });
    toggle.setAttribute('aria-label', current() === 'dark' ? 'Switch to light' : 'Switch to dark');
  }
  toggle.addEventListener('click', function () {
    var next = current() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('stuckit-theme', next); } catch (e) {}
    sync();
  });
  if (dark.addEventListener) dark.addEventListener('change', sync);
  sync();

  var menu = document.getElementById('menu');
  var burger = document.getElementById('burger');
  function setMenu(open) {
    document.body.classList.toggle('menu-open', open);
    burger.setAttribute('aria-expanded', String(open));
    menu.setAttribute('aria-hidden', String(!open));
    if (open) document.getElementById('close').focus(); else burger.focus();
  }
  burger.addEventListener('click', function () { setMenu(true); });
  document.getElementById('close').addEventListener('click', function () { setMenu(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && document.body.classList.contains('menu-open')) setMenu(false);
  });
})();
</script>
